# NuGet vulnerability audit of EVERY published line.
#
# The verification build keeps advisories (NU1901-NU1904) as warnings, because an advisory
# is published against a package rather than introduced by a commit, and would otherwise
# fail unrelated work. This workflow is where they fail instead.
#
# WHY THE MATRIX LISTS EVERY LINE EXPLICITLY - do not "simplify" it to the current ref:
# GitHub runs scheduled workflows from the DEFAULT BRANCH ONLY. Every other line carries an
# identical copy of this file (the CI definitions are held identical on every line), but those
# copies' schedules never fire. If this job audited only the ref it ran on, no line but the default
# branch would ever be audited, and nothing would say so. The matrix is built from
# scripts/ci/published-lines.json, in THIS checkout (the default branch's), so the default
# branch's list decides which lines are audited - the same branch whose schedule fires.
#
# The scripts run from THIS checkout too, against the line checked out beside it, so a line that
# has not yet received a script change is still audited.
#
# The same default-branch rule governs workflow_dispatch: the "Run workflow" button exists only
# for a workflow whose file is on the default branch. A change to this file cannot be tried by
# hand from a feature branch; it takes effect, and can be run, once it reaches main.
#
# Scheduled workflows in a public repository are disabled by GitHub after 60 days without
# repository activity. Run it by hand (workflow_dispatch) to check it is still alive.

name: audit

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lines:
    # The published lines, read once through the same helper the parity and release-tag checks
    # use, so a malformed list fails here rather than auditing part of it.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      lines: ${{ steps.read.outputs.lines }}

    steps:
      - name: Check out the list
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the published lines
        id: read
        shell: pwsh
        run: |
          . ./scripts/ci/PublishedLines.ps1
          $lines = Read-PublishedLines -Path ./scripts/ci/published-lines.json
          "lines=$(ConvertTo-Json -InputObject $lines -Compress)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Auditing: $($lines -join ', ')"

  audit:
    needs: lines
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        line: ${{ fromJSON(needs.lines.outputs.lines) }}

    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

    steps:
      - name: Check out the audit scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out ${{ matrix.line }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.line }}
          path: line
          persist-credentials: false

      - name: Set up .NET (from the audited line's own global.json)
        # The LINE's copy, not this checkout's: each line pins the SDK its Umbraco major needs
        # (sdk.version is the one value the parity check lets differ), and restoring a net11.0 line
        # with the default branch's .NET 10 SDK would fail on the toolchain, not on an advisory.
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: line/global.json

      - name: Audit ${{ matrix.line }}
        # The script lists the line once per configuration it audits (Debug and Release), with
        # the configuration set in the environment so that `dotnet list`'s own implicit restore
        # is that configuration's. A restore step here would be overwritten by that implicit
        # restore and would audit one configuration only - and Release is what ships. Nothing
        # needs building.
        #
        # It runs INSIDE the line's checkout, so every dotnet command looks global.json up from
        # there and gets the line's pinned SDK, not this checkout's. The script depends on its
        # working directory only for -Target; the project paths come from dotnet's own report.
        shell: pwsh
        working-directory: line
        run: ../scripts/ci/Assert-NoVulnerablePackages.ps1 -Target UBookIt.slnx
